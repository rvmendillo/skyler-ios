name: NEXUS
options:
  bundleIdPrefix: com.rey
  deploymentTarget:
    iOS: '18.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  NobodyWho:
    url: https://github.com/nobodywho-ooo/nobodywho-swift.git
    from: 3.0.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_NAME: NEXUS
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 20
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
targets:
  NEXUS:
    type: application
    platform: iOS
    sources:
      - NexusApp/AppModel.swift
      - NexusApp/ArchiveImporter.swift
      - NexusApp/DeviceConnectors.swift
      - NexusApp/Models.swift
      - NexusApp/V3Features.swift
      - NexusApp/V3Views.swift
      - NexusApp/V4Analysis.swift
      - NexusApp/V4Shell.swift
      - NexusApp/V5JourneyModels.swift
      - NexusApp/V6Standardization.swift
      - NexusApp/V6LifeAnalysis.swift
      - NexusApp/V6CompileFixes.swift
      - NexusApp/V6AIEnsemble.swift
      - NexusApp/V6Connectors.swift
      - NexusApp/V6Experience.swift
      - NexusApp/V7ConversationTwin.swift
      - NexusApp/V7LocalLLM.swift
      - NexusApp/V7Storybook.swift
      - NexusApp/V7Personality.swift
      - NexusApp/V7UX.swift
      - NexusApp/V7Ask.swift
      - NexusApp/V7Root.swift
      - NexusApp/V8Multimodal.swift
      - NexusApp/V8UnifiedAI.swift
      - NexusApp/V8FastChat.swift
      - NexusApp/V8FastChatConformance.swift
      - NexusApp/V8FastFiles.swift
      - NexusApp/V8Root.swift
      - NexusApp/V9Core.swift
      - NexusApp/V9Documents.swift
      - NexusApp/V9Assistant.swift
      - NexusApp/V9Experience.swift
      - NexusApp/V9Platform.swift
      - NexusApp/V9Root.swift
      - NexusApp/NEXUSApp.swift
      - NexusApp/Views.swift
      - NexusApp/Assets.xcassets
    dependencies:
      - package: ZIPFoundation
      - package: NobodyWho
      - target: NexusShare
        embed: true
      - target: NexusWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rey.nexus
        INFOPLIST_FILE: NexusApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: NexusApp/NEXUS.entitlements
  NexusShare:
    type: app-extension
    platform: iOS
    sources:
      - NexusShare/ShareViewController.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rey.nexus.share
        PRODUCT_NAME: NexusShare
        INFOPLIST_FILE: NexusShare/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
  NexusWidget:
    type: app-extension
    platform: iOS
    sources:
      - NexusWidget/NexusWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rey.nexus.widget
        PRODUCT_NAME: NexusWidget
        INFOPLIST_FILE: NexusWidget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  NEXUS:
    build:
      targets:
        NEXUS: all
        NexusShare: all
        NexusWidget: all
    run:
      config: Debug
    archive:
      config: Release
