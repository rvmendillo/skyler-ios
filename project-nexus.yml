name: NEXUS
options:
  bundleIdPrefix: com.rey
  deploymentTarget:
    iOS: '18.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_NAME: NEXUS
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Manual
targets:
  NEXUS:
    type: application
    platform: iOS
    sources:
      - path: NexusApp
        excludes:
          - Assets.xcassets
          - Info.plist
          - NEXUS.entitlements
    resources:
      - NexusApp/Assets.xcassets
    info:
      path: NexusApp/Info.plist
    entitlements:
      path: NexusApp/NEXUS.entitlements
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rey.nexus
        INFOPLIST_FILE: NexusApp/Info.plist
schemes:
  NEXUS:
    build:
      targets:
        NEXUS: all
    run:
      config: Debug
    archive:
      config: Release
