name: ReyDL
options:
  bundleIdPrefix: com.rvmendillo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: ""

targets:
  ReyDL:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: REYDL
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.rvmendillo.reydl
            CFBundleURLSchemes:
              - reydl
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.reydl
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ReyDLExtension
        embed: true

  ReyDLExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Extension
        excludes:
          - Resources
      - path: Sources/Extension/Resources
    info:
      path: Sources/Extension/Info.plist
      properties:
        CFBundleDisplayName: REYDL for Safari
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "4"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rvmendillo.reydl.extension
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SUPPORTS_MACCATALYST: NO
