name: Build UltraCompress IPA

on:
  push:
    paths:
      - 'UltraCompress/**'
      - '.github/workflows/ultracompress-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate branded app icon
        run: python3 UltraCompress/Scripts/make_app_icon.py

      - name: Install Tuist
        run: |
          brew update
          brew install tuist
          tuist version

      - name: Generate Xcode project
        working-directory: UltraCompress
        run: tuist generate --no-open

      - name: Build unsigned app
        working-directory: UltraCompress
        run: |
          set -o pipefail
          xcodebuild \
            -project UltraCompress.xcodeproj \
            -scheme UltraCompress \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        working-directory: UltraCompress
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload UltraCompress-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraCompress-unsigned-ipa
          path: UltraCompress/UltraCompress-unsigned.ipa
          if-no-files-found: error
