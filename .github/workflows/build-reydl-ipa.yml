name: Build REYDL IPA

on:
  push:
    branches: [reydl-download-manager]
    paths:
      - 'ReyDL/**'
      - '.github/workflows/build-reydl-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate branded app icon
        working-directory: ReyDL
        run: |
          python3 - <<'PY'
          import math, struct, zlib
          from pathlib import Path

          W = H = 1024
          path = Path('Sources/App/Assets.xcassets/AppIcon.appiconset/REYDL-AppIcon-1024.png')
          path.parent.mkdir(parents=True, exist_ok=True)

          def in_poly(x, y, pts):
              inside = False
              j = len(pts) - 1
              for i in range(len(pts)):
                  xi, yi = pts[i]; xj, yj = pts[j]
                  if ((yi > y) != (yj > y)) and (x < (xj-xi)*(y-yi)/(yj-yi+1e-9)+xi):
                      inside = not inside
                  j = i
              return inside

          bolt = [(610,170),(430,500),(555,500),(455,850),(720,430),(585,430)]
          raw = bytearray()
          for y in range(H):
              raw.append(0)
              for x in range(W):
                  t = (x + y) / (2*(W-1))
                  r = int(20 + 52*(1-t)); g = int(12 + 24*(1-t)); b = int(52 + 120*(1-t))
                  d = math.hypot(x-512, y-500); glow = max(0.0, 1.0 - d/560.0)
                  r = min(255, int(r + 38*glow)); g = min(255, int(g + 24*glow)); b = min(255, int(b + 45*glow))
                  mark = False
                  if 250 <= x <= 335 and 220 <= y <= 790: mark = True
                  if 300 <= x <= 545 and 220 <= y <= 300: mark = True
                  if 300 <= x <= 545 and 455 <= y <= 535: mark = True
                  if 485 <= x <= 565 and 270 <= y <= 490: mark = True
                  if 350 <= y <= 805:
                      cx = 390 + int((y-500)*0.48)
                      if abs(x-cx) <= 43 and y >= 500: mark = True
                  if mark: r = g = b = 246
                  if in_poly(x, y, bolt): r, g, b = 255, 255, 255
                  raw.extend((r,g,b))

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind+data)&0xffffffff)

          png = bytearray(b'\x89PNG\r\n\x1a\n')
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', W,H,8,2,0,0,0))
          png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
          png += chunk(b'IEND', b'')
          path.write_bytes(png)
          print(path, len(png))
          PY

      - name: Verify 206 range support on reported endpoints
        run: |
          set -euo pipefail

          check_range() {
            name="$1"
            url="$2"
            headers="/tmp/${name}-headers.txt"
            body="/tmp/${name}-body.bin"
            curl -fsSL --range 0-0 --max-time 30 --max-filesize 1024 \
              -A 'REYDL/1.1.3' -D "$headers" -o "$body" "$url"
            grep -Eq '^HTTP/[^ ]+ 206' "$headers"
            grep -Eiq '^Content-Range:[[:space:]]*bytes[[:space:]]+0-0/' "$headers"
            test "$(wc -c < "$body" | tr -d ' ')" -eq 1
          }

          check_range hetzner 'https://fsn1-speed.hetzner.com/10GB.bin'
          check_range thinkbroadband 'http://ipv4.download.thinkbroadband.com/5GB.zip'

      - name: Generate Xcode project
        working-directory: ReyDL
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ReyDL
        run: |
          set -euo pipefail
          xcodebuild \
            -project ReyDL.xcodeproj \
            -scheme ReyDL \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Verify multithread probe persistence extension and package IPA
        working-directory: ReyDL
        run: |
          set -euo pipefail
          APP_PATH='build/Build/Products/Release-iphoneos/ReyDL.app'
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/ReyDLExtension.appex"
          test -f "$APP_PATH/PlugIns/ReyDLExtension.appex/manifest.json"
          test -f "$APP_PATH/AppIcon60x60@2x.png" || find "$APP_PATH" -iname '*AppIcon*' -print | grep -q .
          grep -q 'bytes=0-0' Sources/App/DownloadManager.swift
          grep -q 'status == 206' Sources/App/DownloadManager.swift
          grep -q 'liveSession.downloadTask' Sources/App/DownloadManager.swift
          grep -q 'claimDownloadedFile' Sources/App/DownloadManager.swift
          grep -q 'MULTI-CONNECTION PROGRESS' Sources/App/RootView.swift
          grep -q '1 STREAM' Sources/App/RootView.swift
          grep -q 'bin' Sources/App/BrowserView.swift
          grep -q 'bin' Sources/Extension/Resources/content.js
          rm -rf Payload REYDL-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload REYDL-unsigned.ipa
          shasum -a 256 REYDL-unsigned.ipa | tee REYDL-unsigned.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: REYDL-unsigned-ipa
          path: |
            ReyDL/REYDL-unsigned.ipa
            ReyDL/REYDL-unsigned.sha256
          if-no-files-found: error
