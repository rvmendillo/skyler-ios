name: Build MaiChart Maker IPA

on:
  workflow_dispatch:
  push:
    branches:
      - astrodx-maichart-maker
    paths:
      - "MaiChartMaker/**"
      - ".github/workflows/maichart-maker-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon assets
        working-directory: MaiChartMaker
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/python -m pip install --quiet pillow
          .icon-venv/bin/python Scripts/generate_app_icon.py

      - name: Fetch FFmpeg runtime frameworks
        working-directory: MaiChartMaker
        run: |
          rm -rf .ffmpeg-kit
          git clone --depth 1 --filter=blob:none --sparse https://github.com/jaywcjlove/ffmpeg-kit.git .ffmpeg-kit
          git -C .ffmpeg-kit sparse-checkout set Frameworks

      - name: Generate Xcode project
        working-directory: MaiChartMaker
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: MaiChartMaker
        run: xcodebuild -resolvePackageDependencies -project MaiChartMaker.xcodeproj -scheme MaiChartMaker

      - name: Build unsigned device app
        working-directory: MaiChartMaker
        run: |
          set -o pipefail
          xcodebuild \
            -project MaiChartMaker.xcodeproj \
            -scheme MaiChartMaker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Embed FFmpeg frameworks for runtime loading
        working-directory: MaiChartMaker
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/MaiChartMaker.app"
          SRC=".ffmpeg-kit/Frameworks"
          mkdir -p "$APP/Frameworks"

          for name in ffmpegkit libavcodec libavdevice libavfilter libavformat libavutil libswresample libswscale; do
            FRAMEWORK="$SRC/$name.xcframework/ios-arm64/$name.framework"
            if [ ! -d "$FRAMEWORK" ]; then
              echo "Missing FFmpeg framework: $FRAMEWORK"
              exit 1
            fi
            cp -R "$FRAMEWORK" "$APP/Frameworks/"
            codesign --remove-signature "$APP/Frameworks/$name.framework/$name" 2>/dev/null || true
          done

          echo "Embedded runtime-only FFmpeg frameworks:"
          find "$APP/Frameworks" -maxdepth 1 -name "*.framework" -print

      - name: Package IPA
        working-directory: MaiChartMaker
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MaiChartMaker.app Payload/
          /usr/bin/zip -qry MaiChartMaker-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaiChartMaker-unsigned-ipa
          path: MaiChartMaker/MaiChartMaker-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maichart-build-log
          path: MaiChartMaker/xcodebuild.log
          if-no-files-found: ignore
