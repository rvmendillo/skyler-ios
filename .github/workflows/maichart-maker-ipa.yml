name: Build MaiChart Maker IPA

on:
  workflow_dispatch:
  push:
    branches:
      - astrodx-maichart-maker
    paths:
      - "MaiChartMaker/**"
      - ".github/workflows/maichart-maker-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate app icon assets
        working-directory: MaiChartMaker
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/python -m pip install --quiet pillow
          .icon-venv/bin/python Scripts/generate_app_icon.py

      - name: Fetch native audio assets
        working-directory: MaiChartMaker
        run: |
          set -euo pipefail
          rm -rf Resources
          mkdir -p Resources

          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/684543d5e5efaef08d02be50dcda8d552478fa60/GeneralUser-GS.sf2" \
            -o Resources/GeneralUser-GS.sf2
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/684543d5e5efaef08d02be50dcda8d552478fa60/documentation/LICENSE.txt" \
            -o Resources/GeneralUser-GS-LICENSE.txt

          rm -rf /tmp/basic-pitch
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/spotify/basic-pitch.git /tmp/basic-pitch
          git -C /tmp/basic-pitch sparse-checkout set \
            basic_pitch/saved_models/icassp_2022/nmp.mlpackage \
            LICENSE
          cp -R \
            /tmp/basic-pitch/basic_pitch/saved_models/icassp_2022/nmp.mlpackage \
            Resources/BasicPitch_nmp.mlpackage
          cp /tmp/basic-pitch/LICENSE Resources/BasicPitch-LICENSE.txt

          test -f Resources/GeneralUser-GS.sf2
          test -d Resources/BasicPitch_nmp.mlpackage
          du -sh Resources/*

      - name: Generate Xcode project
        working-directory: MaiChartMaker
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: MaiChartMaker
        run: xcodebuild -resolvePackageDependencies -project MaiChartMaker.xcodeproj -scheme MaiChartMaker

      - name: Build unsigned device app
        working-directory: MaiChartMaker
        run: |
          set -o pipefail
          xcodebuild \
            -project MaiChartMaker.xcodeproj \
            -scheme MaiChartMaker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package IPA
        working-directory: MaiChartMaker
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MaiChartMaker.app Payload/
          /usr/bin/zip -qry MaiChartMaker-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MaiChartMaker-unsigned-ipa
          path: MaiChartMaker/MaiChartMaker-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maichart-build-log
          path: MaiChartMaker/xcodebuild.log
          if-no-files-found: ignore
